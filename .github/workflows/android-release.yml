# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/android-release.yml
#
# Builds a signed Android App Bundle (.aab) ready for Google Play upload.
#
# HOW IT WORKS
#   1. Trigger the workflow manually (Actions -> "Android release build" -> Run)
#      or by pushing a tag like `android-v1.0.1`.
#   2. CI checks out the repo, restores the keystore from an encrypted secret,
#      runs `cap sync` + `gradlew bundleRelease`, and uploads the .aab as a
#      GitHub artifact you can download from the run summary page.
#
# ONE-TIME SETUP (do this once per repo)
#   a) Locally: base64-encode your keystore
#         PowerShell:
#           [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\afp-release.jks")) `
#             | Set-Clipboard
#         Linux/macOS:
#           base64 -w0 android/afp-release.jks | pbcopy       # (or xclip -sel c)
#   b) In GitHub: Settings -> Secrets and variables -> Actions -> New repository
#      secret. Add four secrets:
#         ANDROID_KEYSTORE_BASE64   ← paste the base64 blob
#         ANDROID_KEYSTORE_PASSWORD ← the storePassword you chose
#         ANDROID_KEY_ALIAS         ← e.g. afp-release
#         ANDROID_KEY_PASSWORD      ← the keyPassword you chose
#   c) That's it. Delete your local `afp-release.jks` if you like — the
#      encrypted secret in GitHub is now your backup. (Still recommended:
#      keep a second copy in a password manager for disaster recovery.)
# ─────────────────────────────────────────────────────────────────────────────
name: Android release build

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode override (integer). Leave blank to use build.gradle value."
        required: false
      versionName:
        description: "versionName override (string). Leave blank to use build.gradle value."
        required: false
  push:
    tags:
      - "android-v*"

jobs:
  bundle:
    name: Build signed .aab
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Restore the keystore from a base64 GitHub secret ──────────────────
      - name: Restore release keystore
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See workflow header comments."
            exit 1
          fi
          echo "$KS_BASE64" | base64 -d > android/afp-release.jks
          # keystore.properties is picked up by android/app/build.gradle
          cat > android/keystore.properties <<EOF
          storeFile=afp-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install npm deps (for capacitor CLI)
        run: npm install --no-audit --no-fund

      # ── Optional: patch versionCode / versionName from workflow inputs ────
      - name: Patch versionCode / versionName
        if: ${{ inputs.versionCode != '' || inputs.versionName != '' }}
        run: |
          gradle=android/app/build.gradle
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode .*/versionCode ${{ inputs.versionCode }}/" $gradle
          fi
          if [ -n "${{ inputs.versionName }}" ]; then
            sed -i "s/versionName .*/versionName \"${{ inputs.versionName }}\"/" $gradle
          fi
          grep -E "versionCode|versionName" $gradle

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build release App Bundle
        working-directory: android
        run: ./gradlew --no-daemon clean :app:bundleRelease

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ── Cleanup — belt & braces so nothing sensitive is cached ────────────
      - name: Wipe keystore from runner
        if: always()
        run: |
          rm -f android/afp-release.jks android/keystore.properties
